[build]
  command = "npm run build"
  publish = "dist"

# V382 — cabeçalhos de segurança (mesma base do site) + permissões do navegador
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Câmera (scanner/checklist), localização (rotas) e microfone (busca por voz) só para o próprio app
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(self), payment=(), usb=(), interest-cohort=()"
    # CSP em MODO DE TESTE: só registra no console o que seria bloqueado, não bloqueia nada.
    # Depois de validar, trocar o nome do cabeçalho para Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://apis.google.com https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://*.run.app https://firebasestorage.googleapis.com https://api.openrouteservice.org https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://www.google.com; worker-src 'self' blob: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# O service worker nunca deve ficar preso em cache antigo
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
